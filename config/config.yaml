# Top-level workflow configuration (portable defaults).
#
# Which top-level file is used: $PIPELINE_CONFIG if set, otherwise
# config/local/config.yaml if it exists (untracked; a complete copy of this
# file edited for one project or machine), otherwise this file.
#
# Relative paths are resolved against the pipeline/ directory (the Snakemake
# working directory). This file only wires the other configuration files
# together; scientific parameters live in science.yaml and methods/, and
# computational settings live in resources/ and tools/.

# Sequencing inputs: data/<SAMPLE>/{hifi,ont}/
data_dir: ../data

# All workflow outputs. Must not overlap data_dir or any legacy directory.
results_dir: ../results

# Previous results that the workflow must never write into (optional).
legacy_dirs: []

# Optional per-project sample metadata (aliases, acknowledgements, overrides);
# untracked. Template: config/samples.example.yaml.
samples: config/samples.yaml

# Versioned scientific configuration.
science: config/science.yaml
methods_dir: config/methods

# Computational settings (swap these per machine; they never change science).
resources: config/resources/default.yaml
# Tool commands: default.yaml finds every tool on PATH; biohpc.yaml is an
# optional Cornell BioHPC example (fixed install paths and Apptainer images).
tools: config/tools/default.yaml

# Optional raw-data manifest (TSV: genotype, technology, source_path,
# size_bytes). If set, every sample's local runs are reconciled with it
# before assembly (unexpected or missing runs stop that sample).
raw_manifest: ""

# Optional table written by scripts/check_remote_copies.sh confirming that the
# original files still exist on the source storage host. Needed before any
# local raw copy is reported as safe to delete (g2f_tool.py raw-release).
remote_copy_table: ""

# Optional genotype fingerprinting settings (QC only; never affects assembly).
fingerprint: config/fingerprint.yaml

# Optional read-only previous assemblies registered for QC benchmarking;
# untracked. Template: config/external_assemblies.example.yaml.
external_assemblies: config/external_assemblies.yaml

# Optional, untracked machine-specific settings: external read-only input
# references and local paths (e.g. BUSCO lineage directory). See
# config/local/README.md.
local: config/local/local.yaml

# Restrict the run to a subset of samples, e.g. --config only_samples=SAMPLE_A
# Empty list = all discovered samples.
only_samples: []

# Defaults for scripts/run_all_assemblies.sh (its command-line options
# override them). Ignored by Snakemake.
launcher:
  jobs: 1                  # samples at a time
  threads: 32              # CPUs per sample (pinned with taskset)
  mem_gb: 128              # memory budget per sample for Snakemake scheduling
  reserve_gb: 100          # free disk always kept in reserve
  resources: config/resources/default.yaml
  profile: profiles/local
