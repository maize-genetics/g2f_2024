# Example machine-specific configuration. Copy to config/local/local.yaml
# (untracked) and edit.

# Optional read-only references to read files that live outside data/ (for
# example on another filesystem). Keys are canonical sample IDs; paths must be
# absolute. Most users leave this empty and place reads in data/<LINE>/.
external_inputs: {}
#  LINE_ID:
#    hifi:
#      - /path/to/LINE_ID.hifi_reads.bam
#    ont:
#      - /path/to/LINE_ID.ont.fastq.gz

# Offline BUSCO lineage datasets (must contain poales_odb12.2/).
busco_lineage_dir: /path/to/busco_downloads/lineages

# Optional: where pbtk-3.5.0.sif lives if not ../containers (see README).
# containers_dir: /path/to/containers
