# OPTIONAL tool commands for Cornell BioHPC servers (public /programs
# installs and Apptainer images). Select with `tools: config/tools/biohpc.yaml`
# in config/local/config.yaml. The portable default is config/tools/default.yaml.
# Computational environment only. Each entry: the command prefix used by the
# workflow, and the command used to report its version (recorded in
# provenance at execution time).

tools:
  hifiasm:
    cmd: /programs/hifiasm-0.25.0/hifiasm
    version_cmd: /programs/hifiasm-0.25.0/hifiasm --version
  seqkit:
    cmd: /programs/seqkit-2.13.0/seqkit
    version_cmd: /programs/seqkit-2.13.0/seqkit version
  samtools:
    cmd: /programs/samtools-1.20/bin/samtools
    version_cmd: /programs/samtools-1.20/bin/samtools --version | head -1
  # pbtk 3.5.0 is not a BioHPC module; container pulled by digest (README):
  # quay.io/biocontainers/pbtk@sha256:ab2d8dcf1a80e2d7595ab8799c37037766db6fb35d6744440b4643f27749e0ab
  bam2fastq:
    cmd: apptainer exec --bind /workdir,/local/workdir {containers}/pbtk-3.5.0.sif bam2fastq
    version_cmd: apptainer exec {containers}/pbtk-3.5.0.sif bam2fastq --version | head -1
  pbindex:
    cmd: apptainer exec --bind /workdir,/local/workdir {containers}/pbtk-3.5.0.sif pbindex
    version_cmd: apptainer exec {containers}/pbtk-3.5.0.sif pbindex --version | head -1
  meryl:
    cmd: apptainer exec --bind /workdir,/local/workdir /programs/merqury-1.3/merqury.sif meryl
    version_cmd: apptainer exec /programs/merqury-1.3/merqury.sif meryl --version | head -1
  # merqury.sh needs MERQURY set inside the container. Its internal meryl
  # calls take no thread option; the workflow sets OMP_NUM_THREADS (verified).
  merqury:
    cmd: apptainer exec --bind /workdir,/local/workdir --env MERQURY=/opt/conda/share/merqury /programs/merqury-1.3/merqury.sif merqury.sh
    version_cmd: echo merqury-1.3 container /programs/merqury-1.3/merqury.sif
  busco:
    cmd: apptainer exec --bind /workdir,/local/workdir /programs/busco-6.1.0/busco.sif busco
    version_cmd: apptainer exec /programs/busco-6.1.0/busco.sif busco --version | head -1
  # Optional fingerprinting (scripts/g2f_fingerprint.py sketch): BioHPC's
  # sourmash 4.9.3 install and the Python 3.12 it was built for.
  fingerprint_python:
    cmd: env PYTHONPATH=/programs/sourmash-4.9.3/lib/python3.12/site-packages /programs/Python-3.12.7/bin/python3.12
    version_cmd: env PYTHONPATH=/programs/sourmash-4.9.3/lib/python3.12/site-packages /programs/Python-3.12.7/bin/python3.12 -c "import sourmash; print('sourmash', sourmash.VERSION)"
  md5sum:
    cmd: md5sum
    version_cmd: md5sum --version | head -1

# Substituted into {containers} above (relative to pipeline/); override in
# config/local/local.yaml if containers live elsewhere.
containers_dir: ../containers
