# OPTIONAL tool commands for assembly validation on Cornell BioHPC servers
# (public /programs installs). Select with `tools_file:` in the asmqc run
# configuration. Python: the default /usr/bin/python3 (3.9) provides numpy,
# pysam, matplotlib and networkx.
tools:
  minimap2:
    cmd: /programs/minimap2-2.30/minimap2
    version_cmd: /programs/minimap2-2.30/minimap2 --version
  samtools:
    cmd: /programs/samtools-1.20/bin/samtools
    version_cmd: /programs/samtools-1.20/bin/samtools --version | head -1
  seqkit:
    cmd: /programs/seqkit-2.13.0/seqkit
    version_cmd: /programs/seqkit-2.13.0/seqkit version
