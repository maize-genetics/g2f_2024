# Scientific configuration (versioned). Changing anything here changes the
# analysis: bump science_version and record the reason in the project's
# decision log.
science_version: 2

# Automatic assembly method selection. The workflow inspects validated inputs
# for each sample and picks exactly one primary method:
#   - ONT reads present and valid  -> ont_present
#   - no ONT inputs at all         -> ont_absent
#   - ONT inputs present but unusable -> workflow halts (never falls back).
method_policy:
  ont_present: hifiasm-0.25.0_hifi-ont-ul50k_l0_v1
  ont_absent: hifiasm-0.25.0_hifi_l0_v1

# Approximate haploid genome size, used ONLY to report approximate read
# coverage. It is not passed to hifiasm. 2.3 Gb suits typical maize inbred
# assemblies; set it for your species and review per line if needed.
genome_size_bp: 2300000000

# Input discovery policy.
discovery:
  # Number of leading records inspected per file to establish identity
  # (cheap; full-file checks happen later in the workflow).
  sample_records: 200
  # Files with these suffixes are recognised as non-read auxiliary files and
  # ignored (recorded in the inventory as "ignored").
  auxiliary_suffixes:
    - .pbi
    - .bai
    - .csi
    - .xml
    - .md5
    - .sha256
    - .txt
    - .json
    - .html
    - .pdf
    - .log
    - README
    - README.md
  # ONT inputs whose sampled reads are all at least this long are flagged as
  # possibly pre-filtered and require explicit acknowledgement in
  # samples.yaml, because their yield cannot be reported as "raw".
  ont_prefilter_suspect_min_len: 50000

# Read k-mer database (meryl) used by Merqury, plus a diagnostic screen of
# the k-mer spectrum for possible residual heterozygosity. The screen is an
# UNCALIBRATED heuristic: it reports and
# warns; it does not estimate heterozygosity and does not block assembly.
kmer:
  k: 21
  screen:
    # Window around half the main peak coverage inspected for a
    # heterozygous peak.
    half_peak_window: [0.35, 0.65]
    # Warn if the (smoothed) max height in that window exceeds this fraction
    # of the main peak height (~0.4% heterozygosity under idealised
    # assumptions for k=21), or if a smoothed local maximum reaching
    # min_local_max_ratio of the main peak exists there.
    max_half_peak_height_ratio: 0.25
    min_local_max_ratio: 0.05
    # Moving-average window as a fraction of the main peak coverage.
    smooth_frac: 0.1
    # false: diagnostic warning only (recorded in summaries).
    # true: assembly waits for a kmer_review entry in samples.yaml.
    block_assembly_on_flag: false

qc:
  busco:
    # Required BUSCO release (checked against each run's JSON).
    expected_version: 6.1.0
    # Primary lineage, pinned so all assemblies use the same dataset release.
    # Every pinned field is checked against the lineage's dataset.cfg and the
    # BUSCO result JSON (archive_md5 is recorded only; BUSCO verifies it at
    # download).
    # liliopsida_odb10 (historical) and poales_odb12 (OrthoDB 12.1 release,
    # created 2026-05-22) are NOT interchangeable with this dataset.
    lineages:
      # Verified 2026-10-11 after download (busco --download poales_odb12.2;
      # archive poales_odb12.2.2026-05-13.tar.gz, MD5 checked by BUSCO's
      # downloader against file_versions.tsv). 6188 HMMs = 6188 score cutoffs.
      poales_odb12.2:
        datasets_version: odb12.2
        creation_date: "2026-05-13"
        OrthoDB_version: "12.2"
        dataset_version: "01"
        number_of_BUSCOs: "6188"
        archive_md5: c2cf3a2db7a23f9b8c0d3d9af54c5132
    mode: genome
    # miniprot gene predictor (BUSCO mode euk_genome_min in earlier runs).
    gene_predictor: miniprot
  merqury:
    enabled: true
  # Contigs shorter than this are listed separately for organelle /
  # contamination follow-up (no screening tool is run yet).
  small_contig_report_max_len: 1000000
