# Computational settings for the full-scale run on cbsuxm01 (256 logical CPUs,
# 2 TB RAM, ~1.2 TB free on /local/workdir as measured 2026-10-12).
# Used by scripts/run_all_assemblies.sh: three genotypes at a time, one
# Snakemake process each, 40 threads per process (120 in total).
# Changing these never changes results (threads/memory/cleanup only).
# Derivation of the numbers: docs/full_scale_run_plan.md.

tmpdir: ../tmp

rules:
  default:        {threads: 1,  mem_mb: 4000}
  checksum:       {threads: 1,  mem_mb: 1000}
  hifi_bam_to_fastq: {threads: 8, mem_mb: 8000}
  bam_record_count:  {threads: 4, mem_mb: 4000}
  read_stats:     {threads: 4,  mem_mb: 8000}
  ont_filter:     {threads: 4,  mem_mb: 8000}
  # meryl adapts its batch size to the memory it is given (slower, not
  # different, with less); 120 GB keeps one meryl + one hifiasm per genotype
  # from exceeding the per-genotype memory cap together.
  meryl_count:    {threads: 40, mem_mb: 120000}
  # PHBW8 legacy (84 Gb HiFi): HiFi-only peak RSS 66 GB, HiFi+ONT 134 GB.
  # 3AZA1 has ~1.7x more HiFi (est. 140 Gb); 240 GB covers ~1.8x PHBW8.
  hifiasm_hifi:   {threads: 40, mem_mb: 160000}
  hifiasm_hifi_ont: {threads: 40, mem_mb: 240000}
  gfa_to_fasta:   {threads: 1,  mem_mb: 8000}
  validate_fasta: {threads: 1,  mem_mb: 8000}
  assembly_stats: {threads: 4,  mem_mb: 8000}
  busco:          {threads: 32, mem_mb: 64000}
  merqury:        {threads: 16, mem_mb: 64000}
  fingerprint_sketch:  {threads: 3, mem_mb: 8000}
  fingerprint_analyze: {threads: 1, mem_mb: 32000}

# Retention and cleanup (approved 2026-10-12; docs/full_scale_run_plan.md).
# Priority: (1) assemblies, QC, logs, configuration, provenance; (2) prepared
# hifiasm inputs; (3) regenerable intermediates.
cleanup:
  # Converted HiFi FASTQ (prepared hifiasm input, ~1.1 x BAM size).
  #   true:  keep (default when Snakemake is run directly).
  #   false: Snakemake deletes it once read QC, the prepared-input check,
  #          meryl and hifiasm have used it (regenerable from the BAM).
  # scripts/run_all_assemblies.sh decides per genotype from the disk
  # projection (--retain-hifi auto) and passes --config retain_prepared_hifi=.
  # Filtered ONT (>= 50 kb) FASTQs are small and always kept.
  retain_prepared_hifi: true
  # hifiasm ec/ovlp/uidx .bin files (~0.45 bytes per HiFi base + ~13 GB:
  # 40-75 GB per line) are removed only after hifiasm exited 0 AND the
  # p_ctg GFA has sequence lines AND the a_ctg GFA exists; the removed files
  # are listed in <LINE>.asm.removed_bin_files.txt and the job log. Failed or
  # interrupted runs keep them.
  remove_hifiasm_bins_after_success: true
