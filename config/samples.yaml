# Shareable sample metadata (tracked in Git).
#
# Samples are discovered from data/<SAMPLE>/ directories and from external
# input references in config/local/local.yaml. An entry here is optional for
# discovery, but it is where human decisions about a sample are recorded:
#
#   aliases:            historical or alternative names (never used as IDs)
#   metadata:           free-form descriptive fields; use null for unknown
#   exclude_inputs:     basenames of discovered files that must NOT be used,
#                       each with a reason (e.g. derived copy of a BAM)
#   acknowledge:        basenames of files with flagged properties that a
#                       human has reviewed (e.g. pre-filtered ONT reads)
#   kmer_review:        recorded review of a flagged k-mer heterozygosity
#                       screen (status: accepted, reason, reviewer, date)
#   method_override:    use a specific method_id instead of the automatic
#                       policy; requires override_reason
#
# Unknown values are null. Never fill in values that have not been verified.

samples:
  PHBW8:
    aliases: [EB2_PHBW8]
    metadata:
      g2f_line: PHBW8
      germplasm_source: null
      hifi_source_bams:
        # Recorded from the project description; on-disk location and
        # checksums not yet recovered (docs/audit_2026-10-10.md).
        - m84109_240806_024441_s4.hifi_reads.bc2027.bam
        - m84109_240611_191050_s2.hifi_reads.bc2088.bam
      ont_source:
        # Observed in the first 200 read headers of PHBW8_ONT_gt50kb.fastq.gz
        # (workflow discovery, 2026-10-11); not verified for the whole file.
        observed_run_id: a6c999f5ed670f6a87f642dcc2be2382abd9c375
        observed_flow_cell: PAQ81223
        observed_basecall_model: dna_r10.4.1_e8.2_400bps_hac@v4.2.0
        observed_first_read_start_time: "2024-05-20T15:48:21.052850-04:00"
        observed_sample_id_field: ""     # empty in the read headers
        raw_basecalled_files: null       # unknown / not located
        unfiltered_yield_bases: null     # unknown
        filtering_command: null          # unknown
        length_boundary_convention: null # unknown: ">50000" or ">=50000"
      notes: >
        First validation sample. Legacy hifiasm v0.25.0 runs are preserved
        under hifiasm_v0.25.0/ (see docs/legacy/PHBW8_legacy_runs.yaml).
    exclude_inputs: {}
    acknowledge:
      PHBW8_ONT_gt50kb.fastq.gz:
        prefiltered_ont: >
          Approved 2026-10-11 by the project lead. Derived, already
          length-filtered ONT reads (historical name: >50 kb) used as the
          PHBW8 ONT input; raw basecalled reads not located. Reported yields
          are those of this supplied file, not the original sequencing yield;
          the original filtering command, unfiltered yield and length-boundary
          convention (">50000" vs ">=50000") are unknown. The file is used
          as-is (not re-filtered or copied) after verifying every read is
          >= the method's 50,000 bp threshold.
