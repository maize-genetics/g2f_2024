# Historical assemblies registered READ-ONLY for QC validation/benchmarking.
#
# These were NOT produced by this workflow. The workflow never writes into
# their directory: it links to the files from results/<SAMPLE>/imported/<id>/
# and records their identity (size, mtime, fingerprint) at import time; it
# refuses to continue if a registered file later changes.
#
# Results are reported separately (method_id "imported-<id>",
# assembly_source "imported_legacy") and never mixed with pipeline output.
# Provenance limitations: docs/legacy/PHBW8_legacy_runs.yaml.
#
# qc: subset of [stats, busco, merqury]. "stats" also verifies GFA/FASTA
# consistency of the historical conversion. "merqury" requires the sample's
# full HiFi read QC and meryl k-mer counting (substantial compute).

root: ../hifiasm_v0.25.0       # relative to pipeline/

assemblies:
  PHBW8:
    legacy_hifi_ont_l0:
      description: hifiasm 0.25.0-r726, HiFi + ONT (>50 kb, --ul), -l0
      register: docs/legacy/PHBW8_legacy_runs.yaml#legacy_hifi_ont_l0
      read_types: [hifi, ont]
      p_ctg_gfa: ont_hifi/PHBW8_HiFi_Nano_l0.bp.p_ctg.gfa
      p_ctg_fa: ont_hifi/PHBW8_HiFi_Nano_l0.bp.p_ctg.fa
      hifiasm_log: ont_hifi/PHBW8_HiFi_Nano_l0.stderr.log
      qc: [stats, busco]
    legacy_hifi_l0:
      description: hifiasm 0.25.0-r726, HiFi only, -l0
      register: docs/legacy/PHBW8_legacy_runs.yaml#legacy_hifi_l0
      read_types: [hifi]
      p_ctg_gfa: hifi_only/l0/EB2_PHBW8.asm.bp.p_ctg.gfa
      p_ctg_fa: hifi_only/l0/EB2_PHBW8.asm.bp.p_ctg.fa
      hifiasm_log: hifi_only/l0/EB2_PHBW8.asm.stderr.log
      qc: []
    legacy_hifi_default:
      description: hifiasm 0.25.0-r726, HiFi only, default purging
      register: docs/legacy/PHBW8_legacy_runs.yaml#legacy_hifi_default
      read_types: [hifi]
      p_ctg_gfa: hifi_only/default/EB2_PHBW8.asm.bp.p_ctg.gfa
      p_ctg_fa: hifi_only/default/EB2_PHBW8.asm.bp.p_ctg.fa
      hifiasm_log: hifi_only/default/EB2_PHBW8.asm.stderr.log
      qc: []
